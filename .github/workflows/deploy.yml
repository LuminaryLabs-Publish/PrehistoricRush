name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prehistoric-rush-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site/src _site/scenes _site/assets _site/validation _site/kits
          cp index.html menu.html charactercreator.html game.html _site/
          cp .nojekyll _site/.nojekyll
          cp game-scenes.json runner-tuning.json flock-generation.json _site/
          cp kit-composition.json kit-cutover-inventory.json _site/
          cp -R src/* _site/src/
          cp -R scenes/* _site/scenes/
          cp -R assets/* _site/assets/
          cp -R validation/* _site/validation/
          cp -R kits/* _site/kits/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
