name: Unified WebGPU Software Validation

on:
  push:
    branches: [main]
    paths:
      - "src/domains/prehistoric-rush/dense-world-visual-contributions.js"
      - "src/domains/prehistoric-rush/gpu-native-world-scene.js"
      - "src/domains/prehistoric-rush/rendering-implementation.js"
      - "src/game-runtime-shared-gpu-v3.js"
      - "src/shared/runtime-versions.js"
      - "tests/webgpu-software-validation.mjs"
      - ".github/workflows/webgpu-software-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prehistoric-rush-software-webgpu
  cancel-in-progress: true

jobs:
  software-webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install browser validation dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Validate real unified WebGPU execution with software Vulkan
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prehistoric-software-webgpu-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PREHISTORIC_BASE_URL=http://127.0.0.1:4173 node tests/webgpu-software-validation.mjs
          kill $SERVER_PID
          trap - EXIT
