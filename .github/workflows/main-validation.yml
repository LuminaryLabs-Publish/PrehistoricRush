name: Main Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agent/evidence/**"
      - ".agent/runs/**"
      - ".agent/tracker.md"
      - ".agent/target.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: prehistoric-rush-main-validation
  cancel-in-progress: true

jobs:
  node-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic contracts
        run: npm test

  browser-evidence:
    runs-on: ubuntu-latest
    needs: node-contracts
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validation dependency
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Prepare baseline worktree
        run: |
          git worktree add /tmp/prehistoric-baseline e22f6802c9ef5017251017fc87585c6c654d4a4a
          mkdir -p /tmp/prehistoric-baseline/validation
          cp validation/forest-lab.html /tmp/prehistoric-baseline/validation/forest-lab.html
          cp validation/forest-lab.js /tmp/prehistoric-baseline/validation/forest-lab.js
      - name: Capture baseline render evidence
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/prehistoric-baseline >/tmp/prehistoric-baseline-http.log 2>&1 &
          BASELINE_SERVER_PID=$!
          trap 'kill $BASELINE_SERVER_PID || true' EXIT
          PREHISTORIC_BASE_URL=http://127.0.0.1:4174 PREHISTORIC_EVIDENCE_PHASE=before node tests/browser-visual-validation.mjs
          kill $BASELINE_SERVER_PID
          trap - EXIT
      - name: Capture current main render evidence
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prehistoric-current-http.log 2>&1 &
          CURRENT_SERVER_PID=$!
          trap 'kill $CURRENT_SERVER_PID || true' EXIT
          PREHISTORIC_BASE_URL=http://127.0.0.1:4173 PREHISTORIC_EVIDENCE_PHASE=after node tests/browser-visual-validation.mjs
          kill $CURRENT_SERVER_PID
          trap - EXIT
      - name: Compare before and after evidence
        run: |
          mkdir -p .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after
          node tests/compare-visual-evidence.mjs | tee .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after/observed-differences.json
      - name: Upload Headless visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-headless-visual-evidence
          path: .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade
          if-no-files-found: error
          retention-days: 30
      - name: Persist browser evidence to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade
          git commit -m "record prehistoric browser validation evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  pages-smoke:
    runs-on: ubuntu-latest
    needs: browser-evidence
    steps:
      - name: Request Pages rebuild from latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds \
            | tee /tmp/pages-build-request.json
      - name: Verify deployed game from main
        run: |
          curl --fail --location --silent --show-error \
            --retry 24 --retry-delay 10 --retry-all-errors \
            https://luminarylabs-publish.github.io/PrehistoricRush/game.html \
            | grep -q "Prehistoric Rush"
      - name: Verify deployed validation lab
        run: |
          curl --fail --location --silent --show-error \
            --retry 24 --retry-delay 10 --retry-all-errors \
            https://luminarylabs-publish.github.io/PrehistoricRush/validation/forest-lab.html \
            | grep -q "Forest Validation Lab"

  record-deployment:
    runs-on: ubuntu-latest
    needs: pages-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NexusEngine-Editor Headless host
        run: npm install --no-save "github:LuminaryLabs-Dev/NexusEngine-Editor#2c87650436c332324f6c74d87f774a152e3aa8a2"
      - name: Run final nine-stage Headless lifecycle
        env:
          PREHISTORIC_VALIDATED_SHA: ${{ github.sha }}
          PREHISTORIC_WORKFLOW_RUN_ID: ${{ github.run_id }}
          PREHISTORIC_PAGES_PASS: "1"
        run: node tests/headless-editor-evidence.mjs
      - name: Record successful main validation
        env:
          VALIDATED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after
          cat > .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after/deployment-pass.json <<EOF
          {
            "status": "PASS",
            "validatedCommit": "${VALIDATED_SHA}",
            "workflowRunId": "${RUN_ID}",
            "headlessEditorCommit": "2c87650436c332324f6c74d87f774a152e3aa8a2",
            "gameUrl": "https://luminarylabs-publish.github.io/PrehistoricRush/game.html",
            "forestLabUrl": "https://luminarylabs-publish.github.io/PrehistoricRush/validation/forest-lab.html",
            "checks": {
              "nodeContracts": "PASS",
              "browserEvidence": "PASS",
              "pagesGame": "PASS",
              "pagesForestLab": "PASS",
              "headlessLifecycle": "PASS"
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade
          git commit -m "record prehistoric main validation pass [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  record-result:
    if: always()
    runs-on: ubuntu-latest
    needs: [node-contracts, browser-evidence, pages-smoke, record-deployment]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Persist observable workflow result
        env:
          VALIDATED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          NODE_RESULT: ${{ needs.node-contracts.result }}
          BROWSER_RESULT: ${{ needs.browser-evidence.result }}
          PAGES_RESULT: ${{ needs.pages-smoke.result }}
          HEADLESS_RESULT: ${{ needs.record-deployment.result }}
        run: |
          mkdir -p .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after
          cat > .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after/workflow-result.json <<EOF
          {
            "validatedCommit": "${VALIDATED_SHA}",
            "workflowRunId": "${RUN_ID}",
            "jobs": {
              "nodeContracts": "${NODE_RESULT}",
              "browserEvidence": "${BROWSER_RESULT}",
              "pagesSmoke": "${PAGES_RESULT}",
              "headlessLifecycle": "${HEADLESS_RESULT}"
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/evidence/2026-08-09-prehistoric-headless-visual-upgrade/after/workflow-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record prehistoric workflow result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
